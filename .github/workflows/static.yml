<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMATA – Institute for Martial Arts Theory & Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1410;
    --parchment: #f5f0e8;
    --gold: #b8860b;
    --gold-light: #d4a52a;
    --crimson: #7a1a1a;
    --stone: #8a8070;
    --cream: #faf7f2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--parchment);
    font-family: 'Cormorant Garamond', Georgia, serif;
    line-height: 1.7;
    font-size: 18px;
    overflow-x: hidden;
  }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 2rem;
    position: relative;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(184,134,11,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(122,26,26,0.08) 0%, transparent 50%),
      var(--ink);
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 60px,
        rgba(184,134,11,0.03) 60px,
        rgba(184,134,11,0.03) 61px
      ),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(184,134,11,0.03) 60px,
        rgba(184,134,11,0.03) 61px
      );
    pointer-events: none;
  }

  .seal {
    width: 120px;
    height: 120px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 2.5rem;
    position: relative;
    animation: rotateSeal 30s linear infinite;
  }

  .seal::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(184,134,11,0.4);
    border-radius: 50%;
  }

  .seal-inner {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-align: center;
    line-height: 1.3;
    animation: rotateSeal 30s linear infinite reverse;
  }

  @keyframes rotateSeal {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .org-abbr {
    font-family: 'Cinzel', serif;
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 700;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(184,134,11,0.3);
    animation: fadeUp 1s ease both;
  }

  .org-name {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    color: var(--stone);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.5rem;
    animation: fadeUp 1s 0.2s ease both;
  }

  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 2rem auto;
  }

  .mission-hero {
    max-width: 700px;
    font-size: clamp(1.1rem, 2vw, 1.35rem);
    color: var(--parchment);
    font-style: italic;
    font-weight: 300;
    line-height: 1.9;
    animation: fadeUp 1s 0.4s ease both;
    opacity: 0;
    animation-fill-mode: forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SECTIONS */
  .section {
    max-width: 900px;
    margin: 0 auto;
    padding: 5rem 2rem;
    border-top: 1px solid rgba(184,134,11,0.2);
  }

  .section-label {
    font-family: 'Inconsolata', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    font-weight: 600;
    color: var(--parchment);
    margin-bottom: 1.5rem;
    line-height: 1.3;
  }

  .section-body {
    color: rgba(245,240,232,0.85);
    font-size: 1.05rem;
    line-height: 1.9;
  }

  /* MISSION */
  .mission-block {
    background: rgba(184,134,11,0.06);
    border-left: 3px solid var(--gold);
    padding: 2rem 2.5rem;
    margin: 2rem 0;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.9;
  }

  /* PILLARS */
  .pillars {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
    margin-top: 2.5rem;
  }

  .pillar {
    border: 1px solid rgba(184,134,11,0.25);
    padding: 1.75rem;
    position: relative;
    transition: border-color 0.3s, background 0.3s;
    cursor: default;
  }

  .pillar:hover {
    border-color: var(--gold);
    background: rgba(184,134,11,0.06);
  }

  .pillar-num {
    font-family: 'Cinzel', serif;
    font-size: 2rem;
    color: rgba(184,134,11,0.25);
    position: absolute;
    top: 1rem;
    right: 1.25rem;
    font-weight: 700;
    line-height: 1;
  }

  .pillar-title {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    color: var(--gold-light);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
  }

  .pillar-body {
    font-size: 0.95rem;
    color: rgba(245,240,232,0.75);
    line-height: 1.7;
  }

  /* STRUCTURE */
  .tier {
    margin-bottom: 2.5rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid rgba(184,134,11,0.12);
  }

  .tier:last-child { border-bottom: none; }

  .tier-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .tier-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(184,134,11,0.2);
  }

  .tier-role {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--parchment);
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  .tier-desc {
    font-size: 0.95rem;
    color: rgba(245,240,232,0.72);
    line-height: 1.7;
  }

  .tier-duties {
    margin-top: 0.75rem;
    padding-left: 1.25rem;
    list-style: none;
  }

  .tier-duties li {
    font-size: 0.9rem;
    color: rgba(245,240,232,0.65);
    padding: 0.2rem 0;
    position: relative;
  }

  .tier-duties li::before {
    content: '◆';
    font-size: 0.4rem;
    color: var(--gold);
    position: absolute;
    left: -1rem;
    top: 0.55rem;
  }

  /* COMMITTEES */
  .committees {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .committee {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(184,134,11,0.18);
    padding: 1.25rem 1.5rem;
    transition: border-color 0.3s;
  }

  .committee:hover { border-color: rgba(184,134,11,0.5); }

  .committee-name {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    color: var(--gold-light);
    letter-spacing: 0.1em;
    margin-bottom: 0.4rem;
  }

  .committee-desc {
    font-size: 0.88rem;
    color: rgba(245,240,232,0.6);
    line-height: 1.6;
  }

  /* VALUES */
  .values-list {
    columns: 2;
    column-gap: 3rem;
    margin-top: 1.5rem;
    list-style: none;
  }

  @media (max-width: 600px) { .values-list { columns: 1; } }

  .values-list li {
    font-size: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(184,134,11,0.1);
    color: rgba(245,240,232,0.8);
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    break-inside: avoid;
  }

  .val-label {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    white-space: nowrap;
    min-width: 120px;
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 3rem 2rem;
    border-top: 1px solid rgba(184,134,11,0.2);
    font-family: 'Inconsolata', monospace;
    font-size: 0.75rem;
    color: var(--stone);
    letter-spacing: 0.15em;
  }

  .gold { color: var(--gold); }
  .crimson { color: var(--crimson); }
</style>
</head>
<body>

<!-- HERO -->
<header class="hero">
  <div class="seal">
    <div class="seal-inner">SCIENTIA<br>·<br>VIS<br>·<br>HONOR</div>
  </div>
  <div class="org-abbr">IMATA</div>
  <div class="org-name">Institute for Martial Arts Theory &amp; Analysis</div>
  <div class="divider"></div>
  <p class="mission-hero">
    "Where a lifetime of practice meets the discipline of inquiry —<br>
    forging knowledge that endures beyond the dojo."
  </p>
</header>

<!-- MISSION -->
<section class="section">
  <div class="section-label">§ 01 — Foundation</div>
  <h2 class="section-title">Mission Statement</h2>
  <div class="mission-block">
    The Institute for Martial Arts Theory &amp; Analysis (IMATA) exists to advance the rigorous, 
    multidisciplinary study of martial arts as a living body of knowledge. Through scientific 
    inquiry, historical scholarship, biomechanical analysis, and cross-disciplinary theoretical 
    discourse, IMATA preserves, examines, and evolves the intellectual heritage of the martial 
    arts — ensuring that the wisdom accumulated over centuries of practice is neither lost to 
    time nor reduced to tradition alone, but understood, tested, and transmitted with precision 
    and integrity.
  </div>
  <p class="section-body">
    IMATA serves as a collegial brain trust for senior practitioners, scholars, and researchers 
    who bring decades of embodied experience to the table. We hold that deep practice and 
    deep thinking are not opposites — they are the two hands of genuine mastery.
  </p>
</section>

<!-- PILLARS -->
<section class="section">
  <div class="section-label">§ 02 — Purpose</div>
  <h2 class="section-title">Four Pillars of Inquiry</h2>
  <p class="section-body">All IMATA work is organized around four interlocking domains of study:</p>
  <div class="pillars">
    <div class="pillar">
      <div class="pillar-num">I</div>
      <div class="pillar-title">Scientific Analysis</div>
      <div class="pillar-body">Biomechanics, kinesiology, physics of force and leverage, neuroscience of motor learning, and physiological conditioning as applied to martial technique.</div>
    </div>
    <div class="pillar">
      <div class="pillar-num">II</div>
      <div class="pillar-title">Historical Scholarship</div>
      <div class="pillar-body">Tracing the lineage, evolution, and cultural transmission of martial systems across civilizations, eras, and geographies — primary source research included.</div>
    </div>
    <div class="pillar">
      <div class="pillar-num">III</div>
      <div class="pillar-title">Theoretical Frameworks</div>
      <div class="pillar-body">Philosophy of combat, strategic and tactical doctrine, the logic of technique, and the conceptual architecture underlying disparate martial traditions.</div>
    </div>
    <div class="pillar">
      <div class="pillar-num">IV</div>
      <div class="pillar-title">Comparative Analysis</div>
      <div class="pillar-body">Cross-system examination of techniques, principles, and methodologies — identifying convergences, divergences, and transferable insights across traditions.</div>
    </div>
  </div>
</section>

<!-- STRUCTURE -->
<section class="section">
  <div class="section-label">§ 03 — Governance</div>
  <h2 class="section-title">Organizational Structure</h2>
  <p class="section-body" style="margin-bottom:2.5rem;">
    IMATA is governed by a collegial, horizontally-oriented council of senior fellows, 
    with a lean administrative tier to preserve focus on scholarship over bureaucracy.
  </p>

  <div class="tier">
    <div class="tier-title">Tier I — Leadership</div>
    <div class="tier-role">Executive Director / Founding Chair</div>
    <div class="tier-desc">Sets strategic direction; convenes the Council; serves as public voice of the Institute. Ideally the most senior practitioner-scholar.</div>
    <ul class="tier-duties">
      <li>Chairs all formal Council sessions</li>
      <li>Oversees publication and dissemination of Institute work</li>
      <li>Approves membership and Fellow designations</li>
      <li>Manages external partnerships and institutional relationships</li>
    </ul>
  </div>

  <div class="tier">
    <div class="tier-title">Tier II — Council of Senior Fellows</div>
    <div class="tier-role">Senior Fellows (5–12 members)</div>
    <div class="tier-desc">The intellectual core of IMATA. Senior Fellows are experienced practitioners with distinguished standing — practitioners of long tenure (ideally 20+ years), recognized researchers, or credentialed scholars in relevant fields. All have equal standing in deliberation.</div>
    <ul class="tier-duties">
      <li>Lead working groups and research initiatives</li>
      <li>Author or co-author Institute papers and publications</li>
      <li>Peer-review submissions and internal work</li>
      <li>Mentor Associate Fellows</li>
      <li>Vote on organizational direction and membership</li>
    </ul>
  </div>

  <div class="tier">
    <div class="tier-title">Tier III — Associate Fellows</div>
    <div class="tier-role">Associate Fellows (open membership)</div>
    <div class="tier-desc">Serious practitioners and scholars at earlier stages of their careers, or specialists from adjacent fields (historians, physicians, physicists, etc.) contributing targeted expertise.</div>
    <ul class="tier-duties">
      <li>Participate in working groups under Senior Fellow supervision</li>
      <li>Contribute research, translations, or technical analysis</li>
      <li>Eligible for elevation to Senior Fellow by Council vote</li>
    </ul>
  </div>

  <div class="tier">
    <div class="tier-title">Tier IV — Administration</div>
    <div class="tier-role">Secretary-General &amp; Archivist</div>
    <div class="tier-desc">Two functional roles (may be combined in early stages): one managing correspondence, meetings, and records; one maintaining the Institute's growing archive of materials, papers, and primary sources.</div>
  </div>
</section>

<!-- COMMITTEES -->
<section class="section">
  <div class="section-label">§ 04 — Working Groups</div>
  <h2 class="section-title">Standing Committees</h2>
  <p class="section-body">Ongoing research is organized through standing working groups, each chaired by a Senior Fellow:</p>
  <div class="committees">
    <div class="committee">
      <div class="committee-name">Biomechanics &amp; Science</div>
      <div class="committee-desc">Force mechanics, structural analysis, and the physics of martial movement.</div>
    </div>
    <div class="committee">
      <div class="committee-name">History &amp; Lineage</div>
      <div class="committee-desc">Archival research, oral history preservation, and genealogy of martial systems.</div>
    </div>
    <div class="committee">
      <div class="committee-name">Theory &amp; Philosophy</div>
      <div class="committee-desc">Strategic doctrine, conceptual frameworks, and the epistemology of technique.</div>
    </div>
    <div class="committee">
      <div class="committee-name">Comparative Studies</div>
      <div class="committee-desc">Cross-tradition analysis identifying shared principles and divergent methodologies.</div>
    </div>
    <div class="committee">
      <div class="committee-name">Publications &amp; Peer Review</div>
      <div class="committee-desc">Manages the Institute journal, occasional papers, and review processes.</div>
    </div>
    <div class="committee">
      <div class="committee-name">Symposia &amp; Convening</div>
      <div class="committee-desc">Organizes annual gatherings, seminars, and invited speaker events.</div>
    </div>
  </div>
</section>

<!-- VALUES -->
<section class="section">
  <div class="section-label">§ 05 — Principles</div>
  <h2 class="section-title">Guiding Values</h2>
  <ul class="values-list">
    <li><span class="val-label">Intellectual Rigor</span> Conclusions must be earned through evidence and argument.</li>
    <li><span class="val-label">Practitioner Authority</span> Embodied experience is foundational data, not anecdote.</li>
    <li><span class="val-label">Cross-Tradition Respect</span> No system holds a monopoly on truth.</li>
    <li><span class="val-label">Collegial Discourse</span> Challenge ideas; honor the person holding them.</li>
    <li><span class="val-label">Historical Humility</span> We inherit from giants; we owe them precision.</li>
    <li><span class="val-label">Open Inquiry</span> No question about technique is beneath examination.</li>
    <li><span class="val-label">Preservation</span> Knowledge not recorded is knowledge lost.</li>
    <li><span class="val-label">Living Practice</span> Theory untested by movement is incomplete.</li>
  </ul>
</section>

<!-- MEMBERSHIP NOTE -->
<section class="section">
  <div class="section-label">§ 06 — Membership</div>
  <h2 class="section-title">Membership Philosophy</h2>
  <p class="section-body">
    IMATA is deliberately small and high-trust. Membership is by invitation or nomination, 
    reviewed by the Council of Senior Fellows. The criteria are not rank or style — they are 
    <em>intellectual seriousness, longevity of practice, and genuine curiosity</em>. 
    A physicist who has trained for thirty years and a historian who holds a fifth dan 
    are equally welcome. What matters is the willingness to bring one's full mind to the mat.
  </p>
  <br>
  <p class="section-body">
    Annual dues, if any, are kept minimal. The currency of IMATA is contribution — 
    papers written, seminars led, questions asked that nobody else thought to ask.
  </p>
</section>

<footer>
  IMATA — Institute for Martial Arts Theory &amp; Analysis &nbsp;·&nbsp; 
  <span class="gold">Scientia · Vis · Honor</span> &nbsp;·&nbsp; 
  Knowledge · Power · Integrity
</footer>

</body>
</html>
